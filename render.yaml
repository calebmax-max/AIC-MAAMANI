previews:
  generation: automatic

databases:
  - name: aic-maamani-postgres
    plan: basic-256mb
    databaseName: aic_maamani
    user: aic_maamani

services:
  - type: web
    name: aic-maamani-api
    runtime: python
    rootDir: aic-maamani/backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: uploads
      mountPath: /opt/render/project/src/aic-maamani/backend/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aic-maamani-postgres
          property: connectionString
      - key: AIC_MAAMANI_CORS_ORIGINS
        value: https://aic-maamani-web.onrender.com
      - key: AIC_MAAMANI_SESSION_SECRET
        generateValue: true
      - key: AIC_MAAMANI_SESSION_SECURE
        value: "true"
      - key: AIC_MAAMANI_SESSION_SAMESITE
        value: lax
      - key: AIC_MAAMANI_SESSION_MAX_AGE_SECONDS
        value: "28800"

  - type: web
    name: aic-maamani-web
    runtime: static
    rootDir: aic-maamani
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://aic-maamani-api.onrender.com
